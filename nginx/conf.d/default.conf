# Résolution DNS Docker dynamique (streamlit / airflow — URI complète).
resolver 127.0.0.11 valid=10s ipv6=off;

# Racine / : Streamlit sauf API ClickHouse (GET ?query=... ou POST Play UI)
map $request_method $is_ch_post {
    POST    1;
    default 0;
}

map $arg_query $has_ch_query {
    ""      0;
    default 1;
}

map "$is_ch_post:$has_ch_query" $root_backend {
    "0:0"   streamlit:8501;
    default clickhouse:8123;
}

upstream minio_console {
    server minio:9001;
    keepalive 16;
}

upstream dbt_docs_backend {
    server dbt-docs:8085;
    keepalive 8;
}

upstream clickhouse_backend {
    server clickhouse:8123;
    keepalive 16;
}

server {
    listen 80;
    server_name ymfo1nom.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ymfo1nom.com;

    ssl_certificate /etc/letsencrypt/live/ymfo1nom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ymfo1nom.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 512m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location ^~ /doc/ {
        rewrite ^/doc/?(.*)$ /$1 permanent;
    }

    location = /airflow {
        return 301 /airflow/;
    }

    location ^~ /airflow/ {
        set $airflow_upstream airflow-apiserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_redirect off;
        proxy_pass http://$airflow_upstream;
    }

    # ClickHouse : page d'accueil / ping sous /clickhouse/
    location = /clickhouse {
        return 301 /clickhouse/;
    }

    location ^~ /clickhouse/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://clickhouse_backend/;
    }

    # UI HTTP native ClickHouse (liens absolus — pas de préfixe /clickhouse/)
    location ^~ /play {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://clickhouse_backend;
    }

    location ^~ /dashboard {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://clickhouse_backend;
    }

    location ^~ /binary {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_pass http://clickhouse_backend;
    }

    location ^~ /merges {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_pass http://clickhouse_backend;
    }

    location ^~ /js/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_pass http://clickhouse_backend;
    }

    location ^~ /css/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_pass http://clickhouse_backend;
    }

    # Racine exacte : Streamlit (GET) ou API SQL ClickHouse (POST Play / ?query=)
    location = / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_pass http://$root_backend;
    }

    location ^~ /deltalake/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://minio_console/;
    }

    location ^~ /dbt/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_pass http://dbt_docs_backend/;
    }

    location /_stcore/ {
        set $streamlit_upstream streamlit:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_pass http://$streamlit_upstream;
    }

    location / {
        set $streamlit_upstream streamlit:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_pass http://$streamlit_upstream;
    }
}
