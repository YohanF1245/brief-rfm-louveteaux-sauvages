upstream streamlit_backend {
    server streamlit:8501;
    keepalive 16;
}

upstream airflow_backend {
    server airflow-apiserver:8080;
    keepalive 32;
}

upstream clickhouse_backend {
    server clickhouse:8123;
    keepalive 16;
}

upstream minio_console {
    server minio:9001;
    keepalive 16;
}

upstream dbt_docs_backend {
    server dbt-docs:8085;
    keepalive 8;
}

server {
    listen 80;
    server_name ymfo1nom.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ymfo1nom.com;

    ssl_certificate /etc/letsencrypt/live/ymfo1nom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ymfo1nom.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 512m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Ancienne route Streamlit (/doc/) → racine
    location ^~ /doc/ {
        rewrite ^/doc/?(.*)$ /$1 permanent;
    }

    # --- Streamlit (racine du domaine) ---
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        proxy_pass http://streamlit_backend;
    }

    location /_stcore/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_pass http://streamlit_backend;
    }

    # --- Airflow (UI + API) ---
    location /airflow/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /airflow;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_pass http://airflow_backend/;
    }

    # --- ClickHouse (interface HTTP / ping) ---
    location /clickhouse/ {
        rewrite ^/clickhouse/?(.*)$ /$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_pass http://clickhouse_backend;
    }

    # --- MinIO Console (stockage Delta Lake / S3) ---
    location /deltalake/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://minio_console/;
    }

    # --- dbt docs (catalogue modèles) ---
    location /dbt/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_pass http://dbt_docs_backend/;
    }
}
