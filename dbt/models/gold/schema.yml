version: 2

models:
  - name: stack_test_daily_kpis
    description: "KPIs journaliers par région — couche gold pour Power BI."
    columns:
      - name: event_date
        description: "Jour calendaire"
        tests: [not_null]
      - name: region
        description: "Région commerciale"
        tests: [not_null]
      - name: total_revenue
        description: "Chiffre d'affaires du jour/région"
        tests: [not_null]

  - name: wcl_boss_dps
    description: "DPS boss par joueur — couche gold Warcraft Logs pour Play / Power BI."
    columns:
      - name: report_code
        tests: [not_null]
      - name: fight_id
        tests: [not_null]
      - name: player_name
        tests: [not_null]
      - name: dps
        tests: [not_null]

  - name: wcl_player_dps_viz
    description: "DPS boss enrichi — viz multi-joueurs raid/donjon (Power BI / Streamlit)."
    columns:
      - name: player_name
        tests: [not_null]
      - name: dps
        tests: [not_null]
      - name: raid_or_dungeon
        tests: [not_null]
      - name: is_nightmares_asylum
        tests: [not_null]

  - name: wcl_raid_consumables_viz
    description: "Uptime food/flacon/huile et potions en raid boss — Nightmares Asylum."
    columns:
      - name: player_name
        tests: [not_null]
      - name: consumable_type
        tests: [not_null]
      - name: boss_name
        tests: [not_null]
