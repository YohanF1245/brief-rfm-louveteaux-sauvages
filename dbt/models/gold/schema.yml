version: 2

models:
  - name: stack_test_daily_kpis
    description: "KPIs journaliers par région — couche gold pour Power BI."
    columns:
      - name: event_date
        description: "Jour calendaire"
        tests: [not_null]
      - name: region
        description: "Région commerciale"
        tests: [not_null]
      - name: total_revenue
        description: "Chiffre d'affaires du jour/région"
        tests: [not_null]

  - name: wcl_fight_player_perf_viz
    description: "KPI central joueur × fight : DPS/HPS/DTPS, morts, interrupts, potions, spé/ilvl, flag guilde."
    columns:
      - name: report_code
        tests: [not_null]
      - name: fight_id
        tests: [not_null]
      - name: player_name
        tests: [not_null]
      - name: dps
        tests: [not_null]
      - name: is_guild_member
        tests: [not_null]
      - name: fight_duration_sec
        tests: [not_null]

  - name: wcl_damage_taken_viz
    description: "DTPS détaillé : joueur × source de dégâts × sort × fight."
    columns:
      - name: report_code
        tests: [not_null]
      - name: player_name
        tests: [not_null]
      - name: source_name
        tests: [not_null]
      - name: damage_taken
        tests: [not_null]

  - name: wcl_consumables_viz
    description: "Consommables par joueur × fight : uptime exact (flask/food/rune/huile) + casts (potions/healthstones)."
    columns:
      - name: report_code
        tests: [not_null]
      - name: player_name
        tests: [not_null]
      - name: consumable_type
        tests:
          - not_null
          - accepted_values:
              values: ['flask', 'food', 'augment_rune', 'weapon_buff', 'potion', 'healthstone']
      - name: present_at_pull
        tests: [not_null]

  - name: wcl_deaths_viz
    description: "Morts de joueurs : ordre dans le fight, timing, sort fatal."
    columns:
      - name: report_code
        tests: [not_null]
      - name: player_name
        tests: [not_null]
      - name: death_rank
        tests: [not_null]

  - name: wcl_raid_nights_viz
    description: "Synthèse par soirée (report) : pulls, kills, wipes, durée, effectif."
    columns:
      - name: report_code
        tests: [not_null, unique]
      - name: total_pulls
        tests: [not_null]

  - name: wcl_attendance_viz
    description: "Présence des membres du roster guilde par report."
    columns:
      - name: report_code
        tests: [not_null]
      - name: character_name
        tests: [not_null]
      - name: attended
        tests: [not_null]
