name: rfm_lakehouse
version: 1.0.0
config-version: 2
profile: rfm_lakehouse

# Packages hors du projet monté (Airflow worker : DBT_PACKAGES_INSTALL_PATH)
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

models:
  rfm_lakehouse:
    silver:
      +materialized: table
      +schema: silver
      wcl_reports:
        +tags: [warcraftlogs, silver]
      wcl_fights:
        +tags: [warcraftlogs, silver]
      wcl_player_fight_metrics:
        +tags: [warcraftlogs, silver]
      wcl_ingestion_state:
        +tags: [warcraftlogs, silver]
    gold:
      +materialized: table
      +schema: gold
      wcl_boss_dps:
        +tags: [warcraftlogs, gold]
      wcl_player_dps_viz:
        +tags: [warcraftlogs, gold]
      wcl_raid_consumables_viz:
        +tags: [warcraftlogs, gold]
